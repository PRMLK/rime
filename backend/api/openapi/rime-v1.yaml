openapi: 3.1.0
info:
  title: Rime Native API
  version: 1.0.0
  description: Native API for catalog search and playback resolution.
servers:
  - url: /api/v1
security:
  - cookieAuth: []
paths:
  /auth/status:
    get:
      operationId: getAuthStatus
      security: []
      responses:
        '200':
          description: Initial setup and current session state
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthStatus' }
  /auth/setup:
    post:
      operationId: setupInitialAdmin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SetupRequest' }
      responses:
        '201':
          description: Initial administrator created and signed in
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /auth/login:
    post:
      operationId: login
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: Signed in user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Problem' }
        '429': { $ref: '#/components/responses/Problem' }
  /auth/session:
    delete:
      operationId: logout
      responses:
        '204': { description: Session ended }
  /me:
    get:
      operationId: getCurrentUser
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
  /me/password:
    patch:
      operationId: changeOwnPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [currentPassword, newPassword]
              properties:
                currentPassword: { type: string, format: password }
                newPassword: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Password changed; all sessions revoked }
        '400': { $ref: '#/components/responses/Problem' }
        '401': { $ref: '#/components/responses/Problem' }
  /me/playlists:
    get:
      operationId: listOwnPlaylists
      responses:
        '200':
          description: Current user's playlists
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/Playlist' } }
    post:
      operationId: createOwnPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '201':
          description: Playlist created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
  /me/playlists/{playlistId}:
    parameters:
      - $ref: '#/components/parameters/PlaylistId'
    get:
      operationId: getOwnPlaylist
      responses:
        '200':
          description: Playlist and ordered tracks
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PlaylistDetail' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      operationId: renameOwnPlaylist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name: { type: string, minLength: 1, maxLength: 80 }
      responses:
        '200':
          description: Playlist renamed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Playlist' }
        '409': { $ref: '#/components/responses/Problem' }
    delete:
      operationId: deleteOwnPlaylist
      responses:
        '204': { description: Playlist deleted }
        '409': { $ref: '#/components/responses/Problem' }
  /me/playlists/{playlistId}/tracks:
    post:
      operationId: addTrackToOwnPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [trackId]
              properties:
                trackId: { type: string }
      responses:
        '204': { description: Track added }
        '409': { $ref: '#/components/responses/Problem' }
  /me/playlists/{playlistId}/tracks/{trackId}:
    delete:
      operationId: removeTrackFromOwnPlaylist
      parameters:
        - $ref: '#/components/parameters/PlaylistId'
        - $ref: '#/components/parameters/TrackId'
      responses:
        '204': { description: Track removed }
  /me/favorites/tracks/{trackId}:
    parameters:
      - $ref: '#/components/parameters/TrackId'
    get:
      operationId: getFavoriteStatus
      responses:
        '200':
          description: Favorite state for a track
          content:
            application/json:
              schema:
                type: object
                required: [favorite]
                properties:
                  favorite: { type: boolean }
    put:
      operationId: addFavorite
      responses:
        '204': { description: Track is a favorite }
    delete:
      operationId: removeFavorite
      responses:
        '204': { description: Track is not a favorite }
  /admin/users:
    get:
      operationId: listUsers
      responses:
        '200':
          description: All users; administrator only
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/User' } }
        '403': { $ref: '#/components/responses/Problem' }
    post:
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateUserRequest' }
      responses:
        '201':
          description: User created with a favorites playlist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}:
    patch:
      operationId: updateUser
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                displayName: { type: string, minLength: 1, maxLength: 40 }
                role: { type: string, enum: [admin, user] }
                disabled: { type: boolean }
      responses:
        '200':
          description: User updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '403': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }
  /admin/users/{userId}/password-reset:
    post:
      operationId: resetUserPassword
      parameters:
        - $ref: '#/components/parameters/UserId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, format: password, minLength: 8, maxLength: 128 }
      responses:
        '204': { description: Temporary password set and sessions revoked }
        '403': { $ref: '#/components/responses/Problem' }
  /system/info:
    get:
      operationId: getSystemInfo
      responses:
        '200':
          description: Server information and capabilities
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
  /system/tasks:
    get:
      operationId: listScheduledTasks
      responses:
        '200':
          description: Scheduled system tasks and their latest run state
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTaskPage'
  /system/tasks/{taskId}/runs:
    post:
      operationId: runScheduledTask
      parameters:
        - name: taskId
          in: path
          required: true
          schema: { type: string }
      responses:
        '202':
          description: Scheduled task run started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledTask'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /search:
    get:
      operationId: searchTracks
      parameters:
        - name: query
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 20 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Ordered track search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchPage'
        '400':
          $ref: '#/components/responses/Problem'
  /albums/recent:
    get:
      operationId: listRecentAlbums
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 50, default: 12 }
        - name: cursor
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Albums ordered by the most recent media library ingestion time
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumPage'
        '400':
          $ref: '#/components/responses/Problem'
  /albums/{albumId}:
    get:
      operationId: getAlbumDetail
      parameters:
        - name: albumId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Album metadata and its available tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /artists/{artistId}:
    get:
      operationId: getArtistDetail
      parameters:
        - name: artistId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Artist metadata and their available albums
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtistDetail'
        '404':
          $ref: '#/components/responses/Problem'
  /tracks/{trackId}/lyrics:
    get:
      operationId: getTrackLyrics
      parameters:
        - name: trackId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Highest-priority available lyrics for a track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LyricsDocument'
        '404':
          $ref: '#/components/responses/Problem'
  /artworks/{artworkId}:
    get:
      operationId: getArtwork
      parameters:
        - name: artworkId
          in: path
          required: true
          schema: { type: string }
        - name: size
          in: query
          description: Optional maximum dimension for a cached JPEG thumbnail.
          schema: { type: integer, enum: [128, 256, 512, 1024] }
      responses:
        '200':
          description: Original artwork or generated thumbnail
          content:
            image/jpeg: {}
            image/png: {}
            image/gif: {}
            image/webp: {}
        '400':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/Problem'
  /playback/sessions:
    post:
      operationId: createPlaybackSession
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePlaybackSession'
      responses:
        '201':
          description: Resolved playback session
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaybackSession'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
  /playback/sessions/{sessionId}/stream:
    get:
      operationId: streamPlaybackSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: Range
          in: header
          schema: { type: string }
      responses:
        '200': { description: Full media stream }
        '206': { description: Partial media stream }
        '404':
          $ref: '#/components/responses/Problem'
  /playback/sessions/{sessionId}:
    delete:
      operationId: deletePlaybackSession
      parameters:
        - $ref: '#/components/parameters/SessionId'
      responses:
        '204': { description: Playback session released }
  /playback/sessions/{sessionId}/events:
    post:
      operationId: reportPlaybackEvent
      parameters:
        - $ref: '#/components/parameters/SessionId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaybackEvent'
      responses:
        '204': { description: Event accepted }
        '400':
          $ref: '#/components/responses/Problem'
components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: rime_session
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema: { type: string }
    PlaylistId:
      name: playlistId
      in: path
      required: true
      schema: { type: string }
    TrackId:
      name: trackId
      in: path
      required: true
      schema: { type: string }
    UserId:
      name: userId
      in: path
      required: true
      schema: { type: string }
  responses:
    Problem:
      description: RFC 9457 problem details
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    User:
      type: object
      required: [id, username, displayName, role, disabled, mustChangePassword, createdAt]
      properties:
        id: { type: string }
        username: { type: string }
        displayName: { type: string }
        role: { type: string, enum: [admin, user] }
        disabled: { type: boolean }
        mustChangePassword: { type: boolean }
        createdAt: { type: string, format: date-time }
        lastLoginAt: { type: string, format: date-time }
    AuthStatus:
      type: object
      required: [setupRequired, authenticated]
      properties:
        setupRequired: { type: boolean }
        authenticated: { type: boolean }
        user: { $ref: '#/components/schemas/User' }
    SetupRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, maxLength: 40 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    CreateUserRequest:
      type: object
      required: [username, password, role]
      properties:
        username: { type: string, minLength: 3, maxLength: 32 }
        displayName: { type: string, maxLength: 40 }
        password: { type: string, format: password, minLength: 8, maxLength: 128 }
        role: { type: string, enum: [admin, user] }
    Playlist:
      type: object
      required: [id, name, kind, trackCount, createdAt, updatedAt]
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [favorites, custom] }
        trackCount: { type: integer, minimum: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    PlaylistDetail:
      allOf:
        - $ref: '#/components/schemas/Playlist'
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/Track' }
    SystemInfo:
      type: object
      required: [name, apiVersion, capabilities]
      properties:
        name: { type: string }
        apiVersion: { type: string }
        capabilities:
          type: array
          items: { type: string }
    ArtistRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        role: { type: string }
    AlbumRef:
      type: object
      required: [id, title]
      properties:
        id: { type: string }
        title: { type: string }
    Album:
      type: object
      required: [id, title, artists, addedAt]
      properties:
        id: { type: string }
        title: { type: string }
        artists:
          type: array
          items: { $ref: '#/components/schemas/ArtistRef' }
        artworkId: { type: string }
        addedAt: { type: string, format: date-time }
    AlbumPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Album' }
        nextCursor: { type: string }
        previousCursor: { type: string }
    AlbumDetail:
      allOf:
        - $ref: '#/components/schemas/Album'
        - type: object
          required: [tracks]
          properties:
            tracks:
              type: array
              items: { $ref: '#/components/schemas/Track' }
    ArtistDetail:
      type: object
      required: [id, name, albums]
      properties:
        id: { type: string }
        name: { type: string }
        albums:
          type: array
          items: { $ref: '#/components/schemas/Album' }
    Track:
      type: object
      required: [id, title, album, artists, durationMs, available]
      properties:
        id: { type: string }
        title: { type: string }
        album: { $ref: '#/components/schemas/AlbumRef' }
        artists:
          type: array
          items: { $ref: '#/components/schemas/ArtistRef' }
        durationMs: { type: integer, format: int64 }
        discNumber: { type: integer }
        trackNumber: { type: integer }
        artworkId: { type: string }
        artworkFocus:
          type: object
          required: [x, y]
          properties:
            x: { type: number, minimum: 0, maximum: 1 }
            y: { type: number, minimum: 0, maximum: 1 }
        available: { type: boolean }
    LyricsLine:
      type: object
      required: [text]
      properties:
        startMs: { type: integer, format: int64, minimum: 0 }
        endMs: { type: integer, format: int64, minimum: 0 }
        text: { type: string }
    LyricsDocument:
      type: object
      required: [trackId, source, synced, lines]
      properties:
        trackId: { type: string }
        source: { type: string, enum: [manual, sidecar, embedded, lrclib] }
        synced: { type: boolean }
        lines:
          type: array
          items: { $ref: '#/components/schemas/LyricsLine' }
    SearchPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Track' }
        nextCursor: { type: string }
        previousCursor: { type: string }
    ScheduledTask:
      type: object
      required: [id, name, status]
      properties:
        id: { type: string }
        name: { type: string }
        status: { type: string, enum: [idle, running] }
        lastRunAt: { type: string, format: date-time }
        lastDurationMs: { type: integer, format: int64, minimum: 0 }
        lastSucceeded: { type: boolean }
    ScheduledTaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/ScheduledTask' }
    MediaFormat:
      type: object
      required: [container]
      properties:
        container: { type: string }
        codec: { type: string }
    CreatePlaybackSession:
      type: object
      required: [trackId, playerId, capabilities]
      properties:
        trackId: { type: string }
        startPositionMs: { type: integer, format: int64, minimum: 0 }
        playerId: { type: string }
        capabilities:
          type: object
          required: [formats, supportsByteRange]
          properties:
            formats:
              type: array
              items: { $ref: '#/components/schemas/MediaFormat' }
            supportsByteRange: { type: boolean }
    PlaybackSource:
      type: object
      required: [kind, href, contentType, container, seekMethod]
      properties:
        kind: { type: string, enum: [direct, transcode] }
        href: { type: string }
        contentType: { type: string }
        container: { type: string }
        codec: { type: string }
        bitrateKbps:
          type: integer
          minimum: 1
          description: Effective stream bitrate; for direct playback this is the source file bitrate.
        seekMethod: { type: string, enum: [byteRange, timeOffset, none] }
    PlaybackSession:
      type: object
      required: [sessionId, track, source, expiresAt]
      properties:
        sessionId: { type: string }
        track: { $ref: '#/components/schemas/Track' }
        source: { $ref: '#/components/schemas/PlaybackSource' }
        expiresAt: { type: string, format: date-time }
    PlaybackEvent:
      type: object
      required: [eventId, type, positionMs, occurredAt]
      properties:
        eventId: { type: string }
        type: { type: string, enum: [started, progress, paused, ended] }
        positionMs: { type: integer, format: int64, minimum: 0 }
        occurredAt: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, title, status, detail, instance, code]
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
        code: { type: string }
        traceId: { type: string }
